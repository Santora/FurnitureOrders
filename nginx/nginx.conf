server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Klient volá API přes stejný původ (Nginx), proto dostane prázdnou adresu API.
    # Přepisuje wwwroot/appsettings.json publikovaného klienta, který míří na localhost:7222.
    location = /appsettings.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"ApiBaseUrl":""}';
    }

    # API běží ve stejném kontejneru na 127.0.0.1:8080.
    # proxy_pass bez cesty zachová prefix /api/ (API má trasy /api/...).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # volání AI má vlastní timeout 30 s
    }

    # Blazor WebAssembly: neexistující cesty vrátí index.html (klientské směrování)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
